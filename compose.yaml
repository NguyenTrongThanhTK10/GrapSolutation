name: grap-solution-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grap
      POSTGRES_USER: grap
      POSTGRES_PASSWORD: ${GRAP_DB_PASSWORD:-grap-local-development-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grap -d grap"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=grap;Username=grap;Password=${GRAP_DB_PASSWORD:-grap-local-development-only}
      AllowedOrigins: http://127.0.0.1:5173,http://localhost:5173
      DataProtection__KeyPath: /app/.local/keys
    ports: ["127.0.0.1:5080:8080"]
    volumes: ["api_private:/app/.local"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./admin_portal
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
  api_private:
