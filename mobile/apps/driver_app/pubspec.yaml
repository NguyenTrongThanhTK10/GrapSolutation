name: grap_driver
description: "Grap Solution mobile application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  firebase_core: 5.1.0
  firebase_messaging: 17.0.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  geolocator: 14.1.1
  signalr_netcore: 1.4.4
  uuid: ^4.5.3
  flutter_map: 8.3.2
  latlong2: 0.10.1
  intl: ^0.20.2
  url_launcher: 6.3.3
  image_picker: 1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
